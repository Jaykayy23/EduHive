name: Verify EduHive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eduhive_test
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: eduhive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduhive_test -d eduhive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduhive_test:ci_disposable_password@localhost:5432/eduhive_test
      AUTH_TEST_DATABASE_URL: postgresql://eduhive_test:ci_disposable_password@localhost:5432/eduhive_auth_test
      BETTER_AUTH_URL: https://eduhive.example
      BETTER_AUTH_SECRET: ci-only-disposable-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test
      - name: Create a separate empty database for migration preservation tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE eduhive_auth_test'
      - run: npm run test:auth:db
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Verify anonymous public and protected routes
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/eduhive-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/hiveq/demo > /dev/null
          npm run smoke
      - run: npm run package:source

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

# These jobs do not verify live Google OAuth, email delivery, Stream,
# UploadThing, NVIDIA or Gemini. Record those separately on the intended deployment.
