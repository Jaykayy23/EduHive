services:
  - type: web
    name: hiveq-api
    runtime: docker
    plan: free
    dockerfilePath: ./ml-backend/Dockerfile
    dockerContext: ./ml-backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HIVEQ_INTERNAL_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_CONTEXT_CHARS
        value: "60000"
      - key: MAX_PDF_PAGES
        value: "100"
      - key: MAX_DOCX_UNCOMPRESSED_MB
        value: "40"
      - key: FILE_PARSE_TIMEOUT_SECONDS
        value: "15"
      - key: FILE_PARSE_MEMORY_LIMIT_MB
        value: "256"
      - key: MAX_CONCURRENT_FILE_PARSES
        value: "2"
      - key: SUMMARY_MAX_WORDS
        value: "3500"
